<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="artifact-type" content="tool">
  <meta name="design-style" content="terracotta">
  <title>Saber y conocer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;

      /* Page and surfaces (Terracotta) */
      --background: #f9f3eb;
      --surface-container-low: #f3e9dc;
      --surface-container: #ede0d0;
      --surface-container-high: #e4d4c0;

      /* Ink */
      --on-surface: #261b15;
      --on-surface-variant: #57483f;

      /* Borders */
      --outline: #9e8a78;
      --outline-variant: #dfd0be;
      --primary-border: #c98a6b;
      --tertiary-border: #b5d6c9;
      --button-outline: #c4b29e;
      --error-border: #e2b4b4;

      /* Accents */
      --primary: #b84a24;
      --primary-hover: #9e3d1c;
      --on-primary: #ffffff;
      --primary-container: #f7ebe0;
      --on-primary-container: #7d2e12;
      --secondary: #8f6524;
      --tertiary: #1d6356;
      --tertiary-container: #e1efe9;
      --on-tertiary-container: #13473d;
      --error: #b82929;
      --on-error: #ffffff;
      --error-container: #fae6e6;
      --on-error-container: #7c1c1c;

      /* Data series */
      --data-1: #b84a24;
      --data-2: #1d6356;
      --data-3: #b5893e;
      --data-4: #8c3838;
      --data-context: #a39384;

      /* Fonts */
      --font-headline: 'Cormorant Garamond', serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;
      --font-label: 'Plus Jakarta Sans', sans-serif;

      /* Shape */
      --rounded: 0.375rem;
      --rounded-lg: 0.75rem;
      --rounded-arch: 28px 28px 6px 6px;
      --rounded-full: 9999px;

      /* Style effects */
      --soft-shadow: 0 4px 18px rgb(38 27 21 / 0.04);
      --soft-shadow-raised: 0 8px 28px rgb(38 27 21 / 0.07);
      --warm-hairline: 1px solid var(--outline-variant);
      --brass-gradient: linear-gradient(90deg, #d8c3b0, #b5893e, #d8c3b0);

      /* Shared semantic & focus tokens */
      --positive: #1d6356;
      --warning: #8f6524;
      --focus: #b84a24;

      /* Type scale (Focused Tool) */
      --display-size: clamp(2.125rem, 1.5rem + 1.8vw, 2.875rem);
      --headline-size: clamp(1.25rem, 1.1rem + 0.5vw, 1.5rem);
      --subhead-size: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
      --body-size: clamp(0.9375rem, 0.9rem + 0.15vw, 1rem);
      --label-size: 0.75rem;

      /* Spacing scale (4pt base) */
      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2.5rem;
      --space-2xl: 4rem;
      --space-3xl: 6rem;

      /* Motion */
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
      --dur-micro: 120ms;
      --dur-short: 220ms;
      --dur-long: 420ms;
    }

    /* Base reset */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { overflow-x: clip; margin: 0; padding: 0; }
    header { position: static !important; }

    body {
      background-color: var(--background);
      color: var(--on-surface);
      font-family: var(--font-body);
      font-size: var(--body-size);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }

    .page-grid {
      display: grid;
      gap: var(--space-lg);
      padding: var(--space-lg);
      max-width: 1120px;
      margin: 0 auto;
      overflow: hidden;
    }
    .page-grid * { min-width: 0; }

    /* Hero header */
    .hero-header {
      text-align: center;
      padding-block: var(--space-md) var(--space-xs);
    }

    .kicker {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--primary);
      margin: 0 0 var(--space-xs);
    }

    .title {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: var(--display-size);
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--on-surface);
      margin: 0;
    }

    .title em {
      font-style: italic;
      color: var(--primary);
    }

    .ornament-rule {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      margin: var(--space-md) auto 0;
      max-width: 36rem;
      color: var(--secondary);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .ornament-rule::before,
    .ornament-rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--brass-gradient);
    }

    /* Summary arch metrics */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: var(--space-md);
    }

    .arch-card {
      background: var(--surface-container-low);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded-arch);
      padding: var(--space-lg) var(--space-md) var(--space-md);
      text-align: center;
      box-shadow: var(--soft-shadow);
      transition: transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
    }

    .arch-card.is-featured {
      background: var(--primary-container);
      border-color: var(--primary-border);
    }

    .arch-label {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--on-surface-variant);
      margin: 0 0 var(--space-xs);
    }

    .arch-value {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: clamp(1.85rem, 1.4rem + 1.5vw, 2.5rem);
      line-height: 1.05;
      color: var(--on-surface);
      font-variant-numeric: tabular-nums;
      margin: 0;
    }

    .arch-caption {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 600;
      color: var(--tertiary);
      margin: var(--space-xs) 0 0;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: var(--surface-container);
      border-radius: var(--rounded-full);
      overflow: hidden;
      display: flex;
    }

    .progress-seg-correct {
      height: 100%;
      background: var(--tertiary);
      transition: width var(--dur-short) var(--ease-out);
    }

    .progress-seg-wrong {
      height: 100%;
      background: var(--error);
      transition: width var(--dur-short) var(--ease-out);
    }

    .progress-seg-pending {
      height: 100%;
      background: var(--secondary);
      transition: width var(--dur-short) var(--ease-out);
    }

    /* Control bar */
    .toolbar {
      background: var(--surface-container-low);
      border: var(--warm-hairline);
      border-radius: var(--rounded-lg);
      padding: var(--space-sm) var(--space-md);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .toolbar-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: var(--space-sm);
    }

    .segmented {
      display: inline-flex;
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded-full);
      padding: var(--space-xs);
      gap: var(--space-xs);
    }

    .seg-btn {
      min-height: 44px;
      padding: 0 var(--space-md);
      border: none;
      background: transparent;
      color: var(--on-surface-variant);
      border-radius: var(--rounded-full);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.04em;
      transition: background-color var(--dur-micro) var(--ease-in-out), color var(--dur-micro) var(--ease-in-out);
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .seg-btn:hover {
      color: var(--on-surface);
    }

    .seg-btn[aria-pressed="true"] {
      background: var(--surface-container-low);
      color: var(--primary);
      box-shadow: var(--soft-shadow);
    }

    .btn-primary {
      min-height: 44px;
      padding: 0 var(--space-lg);
      border: 1px solid var(--primary);
      border-radius: var(--rounded-full);
      background: var(--primary);
      color: var(--on-primary);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      transition: background-color var(--dur-micro) var(--ease-in-out), transform var(--dur-micro) var(--ease-out);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(1px);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      min-height: 44px;
      padding: 0 var(--space-md);
      border: 1px solid var(--button-outline);
      border-radius: var(--rounded-full);
      background: transparent;
      color: var(--on-surface);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-xs);
      transition: background-color var(--dur-micro) var(--ease-in-out), border-color var(--dur-micro) var(--ease-in-out);
    }

    .btn-secondary:hover:not(:disabled) {
      background: var(--surface-container);
    }

    .btn-secondary[data-armed="true"] {
      background: var(--error-container);
      border-color: var(--error);
      color: var(--on-error-container);
    }

    .btn-secondary:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .filter-pill {
      min-height: 44px;
      padding: 0 var(--space-md);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded-full);
      background: var(--surface-container-low);
      color: var(--on-surface-variant);
      font-size: var(--label-size);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      transition: background-color var(--dur-micro) var(--ease-in-out), color var(--dur-micro) var(--ease-in-out), border-color var(--dur-micro) var(--ease-in-out);
    }

    .filter-pill:hover {
      background: var(--surface-container);
      color: var(--on-surface);
    }

    .filter-pill[aria-pressed="true"] {
      background: var(--primary-container);
      border-color: var(--primary-border);
      color: var(--on-primary-container);
    }

    /* Completion banner */
    .summary-banner {
      background: var(--surface-container);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded-lg);
      padding: var(--space-md) var(--space-lg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-md);
    }

    .summary-banner[hidden] {
      display: none;
    }

    .summary-score-wrap {
      display: flex;
      align-items: baseline;
      gap: var(--space-md);
      flex-wrap: wrap;
    }

    .summary-score {
      font-family: var(--font-headline);
      font-weight: 600;
      font-size: clamp(1.75rem, 1.3rem + 1.2vw, 2.25rem);
      color: var(--on-surface);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    /* Questions Grid */
    .questions-region {
      container-type: inline-size;
    }

    .questions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr));
      gap: var(--space-md);
    }

    .questions-grid.is-single {
      grid-template-columns: minmax(0, 720px);
      justify-content: center;
    }

    .question-card {
      background: var(--surface-container-low);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded-lg);
      padding: var(--space-lg);
      box-shadow: var(--soft-shadow);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
      transition: box-shadow var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out);
    }

    .question-card:hover {
      box-shadow: var(--soft-shadow-raised);
    }

    .question-card.state-correct {
      border-color: var(--tertiary-border);
    }

    .question-card.state-wrong {
      border-color: var(--error-border);
    }

    .question-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      min-height: 28px;
    }

    .question-num {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--secondary);
      font-variant-numeric: tabular-nums;
    }

    .head-actions {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    .badge-emerald {
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      border: 1px solid var(--tertiary-border);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .badge-error {
      background: var(--error-container);
      color: var(--on-error-container);
      border: 1px solid var(--error-border);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
    }

    .badge-selected {
      background: var(--primary-container);
      color: var(--on-primary-container);
      border: 1px solid var(--primary-border);
      padding: var(--space-xs) var(--space-sm);
      border-radius: var(--rounded-full);
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
    }

    .retry-btn {
      min-height: 36px;
      min-width: 36px;
      padding: 0 var(--space-sm);
      border-radius: var(--rounded-full);
      border: 1px solid var(--outline-variant);
      background: var(--background);
      color: var(--on-surface-variant);
      font-size: var(--label-size);
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: var(--space-xs);
      transition: background-color var(--dur-micro) var(--ease-in-out), color var(--dur-micro) var(--ease-in-out);
    }

    .retry-btn:hover {
      background: var(--surface-container-high);
      color: var(--on-surface);
    }

    /* Sentence */
    .question-sentence {
      font-family: var(--font-body);
      font-size: clamp(1.125rem, 1.05rem + 0.3vw, 1.25rem);
      font-weight: 500;
      line-height: 1.5;
      color: var(--on-surface);
      margin: 0;
    }

    .blank-slot {
      display: inline-block;
      min-width: 4.5ch;
      padding: 0 var(--space-xs);
      border-bottom: 2px solid var(--outline);
      text-align: center;
      font-weight: 700;
      color: var(--on-surface-variant);
      transition: color var(--dur-micro) var(--ease-in-out), border-color var(--dur-micro) var(--ease-in-out), background-color var(--dur-micro) var(--ease-in-out);
    }

    .blank-slot.is-filled {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--primary-container);
      border-radius: var(--rounded) var(--rounded) 0 0;
    }

    .blank-slot.is-correct {
      color: var(--on-tertiary-container);
      border-bottom-color: var(--tertiary);
      background: var(--tertiary-container);
      border-radius: var(--rounded) var(--rounded) 0 0;
    }

    .blank-slot.is-wrong {
      color: var(--on-error-container);
      border-bottom-color: var(--error);
      background: var(--error-container);
      border-radius: var(--rounded) var(--rounded) 0 0;
      text-decoration: line-through;
    }

    .correction-chip {
      display: inline-block;
      margin-left: var(--space-xs);
      padding: 0 var(--space-xs);
      background: var(--tertiary-container);
      color: var(--on-tertiary-container);
      border-bottom: 2px solid var(--tertiary);
      border-radius: var(--rounded) var(--rounded) 0 0;
      font-weight: 700;
    }

    /* Options Grid */
    .options-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--space-sm);
    }

    @container (max-width: 360px) {
      .options-grid {
        grid-template-columns: 1fr;
      }
    }

    .option-btn {
      min-height: 46px;
      padding: var(--space-sm) var(--space-md);
      background: var(--background);
      border: 1px solid var(--outline-variant);
      border-radius: var(--rounded);
      color: var(--on-surface);
      font-size: var(--body-size);
      font-weight: 600;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
      transition: background-color var(--dur-micro) var(--ease-in-out), border-color var(--dur-micro) var(--ease-in-out), color var(--dur-micro) var(--ease-in-out), transform var(--dur-micro) var(--ease-out);
    }

    .option-btn:hover:not(:disabled) {
      background: var(--surface-container);
      border-color: var(--outline);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .option-btn:disabled {
      cursor: default;
    }

    .option-btn.is-selected {
      background: var(--primary-container);
      border-color: var(--primary);
      color: var(--on-primary-container);
      box-shadow: inset 0 0 0 1px var(--primary);
    }

    .option-btn.is-correct {
      background: var(--tertiary-container);
      border-color: var(--tertiary);
      color: var(--on-tertiary-container);
      box-shadow: inset 0 0 0 1px var(--tertiary);
    }

    .option-btn.is-wrong {
      background: var(--error-container);
      border-color: var(--error);
      color: var(--on-error-container);
      box-shadow: inset 0 0 0 1px var(--error);
    }

    .option-key {
      font-family: var(--font-label);
      font-size: var(--label-size);
      font-weight: 700;
      color: var(--on-surface-variant);
      opacity: 0.75;
    }

    /* Single card navigation */
    .card-nav {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .card-nav[hidden] {
      display: none;
    }

    .card-nav-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }

    .step-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: var(--space-xs);
    }

    .step-dot {
      min-width: 44px;
      min-height: 44px;
      border-radius: var(--rounded-full);
      border: 1px solid var(--outline-variant);
      background: var(--surface-container-low);
      color: var(--on-surface-variant);
      font-size: var(--label-size);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background-color var(--dur-micro) var(--ease-in-out), border-color var(--dur-micro) var(--ease-in-out), color var(--dur-micro) var(--ease-in-out);
    }

    .step-dot:hover {
      background: var(--surface-container);
    }

    .step-dot.is-current {
      border-color: var(--primary);
      box-shadow: inset 0 0 0 1px var(--primary);
      color: var(--primary);
    }

    .step-dot.is-answered {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .step-dot.is-correct {
      background: var(--tertiary-container);
      border-color: var(--tertiary);
      color: var(--on-tertiary-container);
    }

    .step-dot.is-wrong {
      background: var(--error-container);
      border-color: var(--error);
      color: var(--on-error-container);
    }

    /* Empty filter state */
    .empty-state {
      background: var(--surface-container-low);
      border: var(--warm-hairline);
      border-radius: var(--rounded-lg);
      padding: var(--space-xl);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-md);
    }

    .empty-state[hidden] {
      display: none;
    }

    .empty-title {
      font-family: var(--font-headline);
      font-size: var(--headline-size);
      font-weight: 600;
      margin: 0;
      color: var(--on-surface);
    }

    @media (max-width: 640px) {
      .page-grid {
        padding: var(--space-md);
        gap: var(--space-md);
      }

      .metrics-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-sm);
      }

      .arch-card {
        padding: var(--space-md) var(--space-xs);
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
      }

      .toolbar-group {
        justify-content: space-between;
      }

      .questions-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page-grid">
    <header class="hero-header">
      <p class="kicker">Práctica interactiva</p>
      <h1 class="title">Saber <em>y</em> conocer</h1>
      <div class="ornament-rule" aria-hidden="true"><span>◆</span></div>
    </header>

    <section class="metrics-grid" aria-label="Resumen">
      <div class="arch-card">
        <p class="arch-label">Respondidas</p>
        <p class="arch-value" id="stat-answered">0 / 12</p>
        <p class="arch-caption" id="stat-pending">12 pendientes</p>
      </div>
      <div class="arch-card is-featured">
        <p class="arch-label">Aciertos</p>
        <p class="arch-value" id="stat-correct">0 / 12</p>
        <p class="arch-caption" id="stat-wrong">0 errores</p>
      </div>
      <div class="arch-card">
        <p class="arch-label">Precisión</p>
        <p class="arch-value" id="stat-accuracy">—</p>
        <p class="arch-caption" id="stat-mode-label">Inmediata</p>
      </div>
    </section>

    <div class="progress-track" role="progressbar" aria-label="Progreso" aria-valuemin="0" aria-valuemax="12" aria-valuenow="0" id="progress-bar">
      <div class="progress-seg-correct" id="seg-correct" style="width: 0%"></div>
      <div class="progress-seg-wrong" id="seg-wrong" style="width: 0%"></div>
      <div class="progress-seg-pending" id="seg-pending" style="width: 0%"></div>
    </div>

    <section class="toolbar" aria-label="Controles">
      <div class="toolbar-group">
        <div class="segmented" role="group" aria-label="Vista">
          <button type="button" class="seg-btn" id="view-list-btn" aria-pressed="true" onclick="setView('list')">Lista</button>
          <button type="button" class="seg-btn" id="view-card-btn" aria-pressed="false" onclick="setView('card')">Tarjeta</button>
        </div>

        <div class="segmented" role="group" aria-label="Modo de corrección">
          <button type="button" class="seg-btn" id="mode-immediate-btn" aria-pressed="true" onclick="setMode('immediate')">Inmediata</button>
          <button type="button" class="seg-btn" id="mode-exam-btn" aria-pressed="false" onclick="setMode('exam')">Examen</button>
        </div>
      </div>

      <div class="toolbar-group" id="filter-group" role="group" aria-label="Filtro">
        <button type="button" class="filter-pill" id="filter-all-btn" aria-pressed="true" onclick="setFilter('all')">Todas</button>
        <button type="button" class="filter-pill" id="filter-pending-btn" aria-pressed="false" onclick="setFilter('pending')">Pendientes</button>
        <button type="button" class="filter-pill" id="filter-wrong-btn" aria-pressed="false" onclick="setFilter('wrong')">Incorrectas</button>
      </div>

      <div class="toolbar-group">
        <button type="button" class="btn-primary" id="check-exam-btn" onclick="checkAll()" hidden>Comprobar</button>
        <button type="button" class="btn-secondary" id="reset-btn" data-armed="false" onclick="handleReset(this)">Reiniciar</button>
      </div>
    </section>

    <section class="summary-banner" id="summary-banner" hidden aria-live="polite">
      <div class="summary-score-wrap">
        <span class="summary-score" id="banner-score">12 / 12</span>
        <span class="badge-emerald" id="banner-pct">100%</span>
      </div>
      <div class="toolbar-group">
        <button type="button" class="btn-primary" id="retry-wrong-btn" onclick="retryWrong()">Repasar incorrectas</button>
        <button type="button" class="btn-secondary" onclick="resetNow()">Reiniciar todo</button>
      </div>
    </section>

    <section class="questions-region" aria-label="Preguntas">
      <div class="questions-grid" id="questions-grid"></div>
      <div class="empty-state" id="empty-state" hidden>
        <p class="empty-title" id="empty-title">Sin preguntas en este filtro</p>
        <button type="button" class="btn-secondary" onclick="setFilter('all')">Ver todas</button>
      </div>
    </section>

    <nav class="card-nav" id="card-nav" aria-label="Navegación entre preguntas" hidden>
      <div class="card-nav-row">
        <button type="button" class="btn-secondary" id="prev-btn" onclick="stepCard(-1)">Anterior</button>
        <span class="question-num" id="card-counter">1 / 12</span>
        <button type="button" class="btn-primary" id="next-btn" onclick="stepCard(1)">Siguiente</button>
      </div>
      <div class="step-dots" id="step-dots"></div>
    </nav>
  </main>

  <api-shim></api-shim>
  <script>
    const QUESTIONS = [
      {
        id: 1,
        before: `¿`,
        after: ` a mi amigo Juan?`,
        options: [`sabes`, `conoces`, `conozco`, `sé`],
        answer: `conoces`
      },
      {
        id: 2,
        before: `Mi padre `,
        after: ` pescar.`,
        options: [`conocen`, `sé`, `conoce`, `sabe`],
        answer: `sabe`
      },
      {
        id: 3,
        before: `¿Juanita `,
        after: ` dibujar?`,
        options: [`conocen`, `conoce`, `saben`, `sabe`],
        answer: `sabe`
      },
      {
        id: 4,
        before: `Yo `,
        after: ` a Silvia.`,
        options: [`sé`, `conoce`, `sabe`, `conozco`],
        answer: `conozco`
      },
      {
        id: 5,
        before: `Ellos `,
        after: ` París.`,
        options: [`saben`, `conoce`, `conocen`, `sé`],
        answer: `conocen`
      },
      {
        id: 6,
        before: `¿`,
        after: ` quién es él?`,
        options: [`conoces`, `conoce`, `sabes`, `sabe`],
        answer: `sabes`
      },
      {
        id: 7,
        before: `Vosotros no `,
        after: ` nadar.`,
        options: [`conocemos`, `sabemos`, `sabéis`, `conocéis`],
        answer: `sabéis`
      },
      {
        id: 8,
        before: `Yo `,
        after: ` la respuesta.`,
        options: [`conozco`, `sé`, `sabe`, `conoce`],
        answer: `sé`
      },
      {
        id: 9,
        before: `Ellos `,
        after: ` a la profesora.`,
        options: [`sabe`, `conocen`, `saben`, `conoce`],
        answer: `conocen`
      },
      {
        id: 10,
        before: `Nosotros `,
        after: ` hablar español.`,
        options: [`sabemos`, `sabe`, `conoce`, `conocemos`],
        answer: `sabemos`
      },
      {
        id: 11,
        before: `¿Quién `,
        after: ` a Lidia?`,
        options: [`sabe`, `conoce`, `conozco`, `sé`],
        answer: `conoce`
      },
      {
        id: 12,
        before: `Tomás `,
        after: ` tocar el piano.`,
        options: [`sabemos`, `sabe`, `conocemos`, `conoce`],
        answer: `sabe`
      }
    ];

    let state = {
      answers: {},
      checked: {},
      mode: `immediate`,
      view: `list`,
      filter: `all`,
      currentIdx: 0
    };

    const ICON_CHECK = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
    const ICON_X = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
    const ICON_RETRY = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>`;

    async function saveState() {
      if (window.notebookAppApi && typeof window.notebookAppApi.setAppState === 'function') {
        try {
          await window.notebookAppApi.setAppState(state);
        } catch (err) {
          /* ignore persistence errors */
        }
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function selectOption(qId, optIndex) {
      const q = QUESTIONS.find(item => item.id === qId);
      if (!q) return;

      disarmReset();

      if (state.mode === `immediate`) {
        if (state.checked[qId]) return;
        state.answers[qId] = optIndex;
        state.checked[qId] = true;
      } else {
        if (state.checked[qId]) return;
        state.answers[qId] = optIndex;
      }

      render();
      saveState();
    }

    function retryQuestion(qId) {
      disarmReset();
      delete state.answers[qId];
      delete state.checked[qId];
      render();
      saveState();
    }

    function checkAll() {
      disarmReset();
      QUESTIONS.forEach(q => {
        if (typeof state.answers[q.id] === 'number') {
          state.checked[q.id] = true;
        }
      });
      render();
      saveState();
    }

    function setMode(newMode) {
      if (state.mode === newMode) return;
      disarmReset();
      state.mode = newMode;
      if (newMode === `immediate`) {
        QUESTIONS.forEach(q => {
          if (typeof state.answers[q.id] === 'number') {
            state.checked[q.id] = true;
          }
        });
      }
      render();
      saveState();
    }

    function setView(newView) {
      if (state.view === newView) return;
      disarmReset();
      state.view = newView;
      render();
      saveState();
    }

    function setFilter(newFilter) {
      disarmReset();
      state.filter = newFilter;
      render();
      saveState();
    }

    function goToCard(idx) {
      if (idx < 0 || idx >= QUESTIONS.length) return;
      disarmReset();
      state.currentIdx = idx;
      render();
      saveState();
    }

    function stepCard(delta) {
      goToCard(state.currentIdx + delta);
    }

    function retryWrong() {
      disarmReset();
      let firstWrongIdx = -1;
      QUESTIONS.forEach((q, idx) => {
        const selIdx = state.answers[q.id];
        const isChecked = Boolean(state.checked[q.id]);
        if (isChecked && typeof selIdx === 'number' && q.options[selIdx] !== q.answer) {
          if (firstWrongIdx === -1) firstWrongIdx = idx;
          delete state.answers[q.id];
          delete state.checked[q.id];
        }
      });
      if (firstWrongIdx !== -1 && state.view === `card`) {
        state.currentIdx = firstWrongIdx;
      }
      state.filter = `all`;
      render();
      saveState();
    }

    function resetNow() {
      disarmReset();
      state.answers = {};
      state.checked = {};
      state.filter = `all`;
      state.currentIdx = 0;
      render();
      saveState();
    }

    function disarmReset() {
      const btn = document.getElementById('reset-btn');
      if (btn && btn.dataset.armed === 'true') {
        btn.dataset.armed = 'false';
        btn.textContent = `Reiniciar`;
      }
    }

    function handleReset(btn) {
      if (!btn) return;
      if (btn.dataset.armed !== 'true') {
        btn.dataset.armed = 'true';
        btn.textContent = `¿Confirmar?`;
        return;
      }
      resetNow();
    }

    function computeStats() {
      let answered = 0;
      let checkedCount = 0;
      let correct = 0;
      let wrong = 0;

      QUESTIONS.forEach(q => {
        const selIdx = state.answers[q.id];
        const hasAnswer = typeof selIdx === 'number';
        const isChecked = Boolean(state.checked[q.id]);
        if (hasAnswer) answered += 1;
        if (hasAnswer && isChecked) {
          checkedCount += 1;
          if (q.options[selIdx] === q.answer) {
            correct += 1;
          } else {
            wrong += 1;
          }
        }
      });

      const pending = QUESTIONS.length - answered;
      const unchecked = answered - checkedCount;
      const accuracy = checkedCount > 0 ? Math.round((correct / checkedCount) * 100) : null;

      return { answered, checkedCount, correct, wrong, pending, unchecked, accuracy };
    }

    function buildQuestionCard(q) {
      const selIdx = state.answers[q.id];
      const hasAnswer = typeof selIdx === 'number';
      const isChecked = Boolean(state.checked[q.id]);
      const chosenWord = hasAnswer ? q.options[selIdx] : null;
      const isCorrect = isChecked && chosenWord === q.answer;
      const isWrong = isChecked && chosenWord !== q.answer;

      let cardStateClass = ``;
      if (isCorrect) cardStateClass = `state-correct`;
      else if (isWrong) cardStateClass = `state-wrong`;

      let badgeHtml = ``;
      if (isCorrect) {
        badgeHtml = `<span class="badge-emerald">${ICON_CHECK} Correcto</span>`;
      } else if (isWrong) {
        badgeHtml = `<span class="badge-error">${ICON_X} Incorrecto</span>`;
      } else if (hasAnswer) {
        badgeHtml = `<span class="badge-selected">Seleccionada</span>`;
      }

      const retryBtnHtml = isChecked
        ? `<button type="button" class="retry-btn" onclick="retryQuestion(${q.id})" aria-label="Reintentar pregunta ${q.id}">${ICON_RETRY} Reintentar</button>`
        : ``;

      let blankHtml = `<span class="blank-slot">_____</span>`;
      if (hasAnswer) {
        if (isCorrect) {
          blankHtml = `<span class="blank-slot is-correct">${escapeHtml(chosenWord)}</span>`;
        } else if (isWrong) {
          blankHtml = `<span class="blank-slot is-wrong">${escapeHtml(chosenWord)}</span><span class="correction-chip">${escapeHtml(q.answer)}</span>`;
        } else {
          blankHtml = `<span class="blank-slot is-filled">${escapeHtml(chosenWord)}</span>`;
        }
      }

      const letters = [`A`, `B`, `C`, `D`];
      const optionsHtml = q.options.map((opt, idx) => {
        const isSel = selIdx === idx;
        const isOptAnswer = opt === q.answer;
        let optClass = `option-btn`;
        let iconHtml = `<span class="option-key">${letters[idx]}</span>`;

        if (isChecked) {
          if (isOptAnswer) {
            optClass += ` is-correct`;
            iconHtml = ICON_CHECK;
          } else if (isSel && !isOptAnswer) {
            optClass += ` is-wrong`;
            iconHtml = ICON_X;
          }
        } else if (isSel) {
          optClass += ` is-selected`;
        }

        const disabledAttr = isChecked ? `disabled` : ``;
        return `<button type="button" class="${optClass}" aria-pressed="${isSel ? 'true' : 'false'}" ${disabledAttr} onclick="selectOption(${q.id}, ${idx})"><span>${escapeHtml(opt)}</span>${iconHtml}</button>`;
      }).join(``);

      return `
        <article class="question-card ${cardStateClass}">
          <div class="question-head">
            <span class="question-num">${q.id < 10 ? `0${q.id}` : `${q.id}`} / 12</span>
            <div class="head-actions">${badgeHtml}${retryBtnHtml}</div>
          </div>
          <p class="question-sentence">${escapeHtml(q.before)}${blankHtml}${escapeHtml(q.after)}</p>
          <div class="options-grid">${optionsHtml}</div>
        </article>
      `;
    }

    function render() {
      const stats = computeStats();

      const statAnswered = document.getElementById('stat-answered');
      const statPending = document.getElementById('stat-pending');
      const statCorrect = document.getElementById('stat-correct');
      const statWrong = document.getElementById('stat-wrong');
      const statAccuracy = document.getElementById('stat-accuracy');
      const statModeLabel = document.getElementById('stat-mode-label');

      if (statAnswered) statAnswered.textContent = `${stats.answered} / 12`;
      if (statPending) statPending.textContent = stats.pending === 1 ? `1 pendiente` : `${stats.pending} pendientes`;
      if (statCorrect) statCorrect.textContent = `${stats.correct} / 12`;
      if (statWrong) statWrong.textContent = stats.wrong === 1 ? `1 error` : `${stats.wrong} errores`;
      if (statAccuracy) statAccuracy.textContent = stats.accuracy !== null ? `${stats.accuracy}%` : `—`;
      if (statModeLabel) statModeLabel.textContent = state.mode === `immediate` ? `Inmediata` : `Examen`;

      const progressBar = document.getElementById('progress-bar');
      const segCorrect = document.getElementById('seg-correct');
      const segWrong = document.getElementById('seg-wrong');
      const segPending = document.getElementById('seg-pending');
      if (progressBar) progressBar.setAttribute('aria-valuenow', String(stats.answered));
      if (segCorrect) segCorrect.style.width = `${(stats.correct / 12) * 100}%`;
      if (segWrong) segWrong.style.width = `${(stats.wrong / 12) * 100}%`;
      if (segPending) segPending.style.width = `${(stats.unchecked / 12) * 100}%`;

      const viewListBtn = document.getElementById('view-list-btn');
      const viewCardBtn = document.getElementById('view-card-btn');
      if (viewListBtn) viewListBtn.setAttribute('aria-pressed', state.view === `list` ? `true` : `false`);
      if (viewCardBtn) viewCardBtn.setAttribute('aria-pressed', state.view === `card` ? `true` : `false`);

      const modeImmBtn = document.getElementById('mode-immediate-btn');
      const modeExamBtn = document.getElementById('mode-exam-btn');
      if (modeImmBtn) modeImmBtn.setAttribute('aria-pressed', state.mode === `immediate` ? `true` : `false`);
      if (modeExamBtn) modeExamBtn.setAttribute('aria-pressed', state.mode === `exam` ? `true` : `false`);

      const checkExamBtn = document.getElementById('check-exam-btn');
      if (checkExamBtn) {
        checkExamBtn.hidden = state.mode !== `exam`;
        checkExamBtn.disabled = stats.unchecked === 0;
      }

      const filterGroup = document.getElementById('filter-group');
      if (filterGroup) filterGroup.hidden = state.view === `card`;

      const filterAllBtn = document.getElementById('filter-all-btn');
      const filterPendingBtn = document.getElementById('filter-pending-btn');
      const filterWrongBtn = document.getElementById('filter-wrong-btn');
      if (filterAllBtn) filterAllBtn.setAttribute('aria-pressed', state.filter === `all` ? `true` : `false`);
      if (filterPendingBtn) {
        filterPendingBtn.setAttribute('aria-pressed', state.filter === `pending` ? `true` : `false`);
        filterPendingBtn.textContent = `Pendientes (${stats.pending})`;
      }
      if (filterWrongBtn) {
        filterWrongBtn.setAttribute('aria-pressed', state.filter === `wrong` ? `true` : `false`);
        filterWrongBtn.textContent = `Incorrectas (${stats.wrong})`;
      }

      const summaryBanner = document.getElementById('summary-banner');
      const bannerScore = document.getElementById('banner-score');
      const bannerPct = document.getElementById('banner-pct');
      const retryWrongBtn = document.getElementById('retry-wrong-btn');
      if (summaryBanner) {
        const allChecked = stats.checkedCount === QUESTIONS.length;
        summaryBanner.hidden = !allChecked;
        if (allChecked) {
          if (bannerScore) bannerScore.textContent = `${stats.correct} / 12`;
          if (bannerPct) bannerPct.textContent = `${stats.accuracy}%`;
          if (retryWrongBtn) retryWrongBtn.hidden = stats.wrong === 0;
        }
      }

      const grid = document.getElementById('questions-grid');
      const emptyState = document.getElementById('empty-state');
      const emptyTitle = document.getElementById('empty-title');
      const cardNav = document.getElementById('card-nav');

      if (!grid) return;

      if (state.view === `card`) {
        grid.classList.add('is-single');
        if (emptyState) emptyState.hidden = true;
        if (cardNav) cardNav.hidden = false;

        const safeIdx = Math.max(0, Math.min(QUESTIONS.length - 1, state.currentIdx));
        state.currentIdx = safeIdx;
        grid.innerHTML = buildQuestionCard(QUESTIONS[safeIdx]);

        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const cardCounter = document.getElementById('card-counter');
        const stepDots = document.getElementById('step-dots');

        if (prevBtn) prevBtn.disabled = safeIdx === 0;
        if (nextBtn) nextBtn.disabled = safeIdx === QUESTIONS.length - 1;
        if (cardCounter) cardCounter.textContent = `${safeIdx + 1} / 12`;

        if (stepDots) {
          stepDots.innerHTML = QUESTIONS.map((q, idx) => {
            const selIdx = state.answers[q.id];
            const hasAns = typeof selIdx === 'number';
            const isChk = Boolean(state.checked[q.id]);
            let cls = `step-dot`;
            if (idx === safeIdx) cls += ` is-current`;
            if (hasAns && isChk) {
              cls += q.options[selIdx] === q.answer ? ` is-correct` : ` is-wrong`;
            } else if (hasAns) {
              cls += ` is-answered`;
            }
            return `<button type="button" class="${cls}" onclick="goToCard(${idx})" aria-label="Pregunta ${q.id}">${q.id}</button>`;
          }).join(``);
        }
      } else {
        grid.classList.remove('is-single');
        if (cardNav) cardNav.hidden = true;

        const visible = QUESTIONS.filter(q => {
          const selIdx = state.answers[q.id];
          const hasAns = typeof selIdx === 'number';
          const isChk = Boolean(state.checked[q.id]);
          if (state.filter === `pending`) return !hasAns;
          if (state.filter === `wrong`) return isChk && hasAns && q.options[selIdx] !== q.answer;
          return true;
        });

        if (visible.length === 0) {
          grid.innerHTML = ``;
          if (emptyState) emptyState.hidden = false;
          if (emptyTitle) {
            emptyTitle.textContent = state.filter === `wrong` ? `Sin respuestas incorrectas` : `Sin preguntas pendientes`;
          }
        } else {
          if (emptyState) emptyState.hidden = true;
          grid.innerHTML = visible.map(buildQuestionCard).join(``);
        }
      }
    }

    document.addEventListener('keydown', function(e) {
      if (state.view !== `card`) return;
      if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
      if (e.key === 'ArrowLeft') {
        stepCard(-1);
      } else if (e.key === 'ArrowRight') {
        stepCard(1);
      } else if (e.key >= '1' && e.key <= '4') {
        const q = QUESTIONS[state.currentIdx];
        if (q) selectOption(q.id, Number(e.key) - 1);
      }
    });

    async function init() {
      if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === 'function') {
        try {
          const saved = await window.notebookAppApi.getAppState();
          if (saved && typeof saved === 'object') {
            if (saved.answers && typeof saved.answers === 'object') state.answers = saved.answers;
            if (saved.checked && typeof saved.checked === 'object') state.checked = saved.checked;
            if (saved.mode === `immediate` || saved.mode === `exam`) state.mode = saved.mode;
            if (saved.view === `list` || saved.view === `card`) state.view = saved.view;
            if (saved.filter === `all` || saved.filter === `pending` || saved.filter === `wrong`) state.filter = saved.filter;
            if (typeof saved.currentIdx === 'number') state.currentIdx = saved.currentIdx;
          }
        } catch (err) {
          /* ignore load errors */
        }
      }

      render();

      if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === 'function') {
        window.notebookAppApi.notifyAppReady();
      }
    }

    init();
  </script>
</body>
</html>
